# Ingest incremental automatizado. Roda a pipeline (crawler + parsers + chunker + ingest + snapshot)
# de forma incremental (so o que mudou no site paga LLM/embed), atualiza o Upstash e commita de
# volta o snapshot da pagina, o que dispara o redeploy do Vercel. Nao usa o read key nem o Redis.
name: Ingest incremental

on:
  schedule:
    # todo dia 05:37 UTC (02:37 BRT). minuto fora da hora cheia porque o GitHub atrasa os agendamentos
    # da hora cheia: o de 06:00 UTC comecou entre 11:02 e 13:53 UTC nas ultimas execucoes
    - cron: "37 5 * * *"
  workflow_dispatch: {}     # gatilho manual (usado para testar o anti-bot no runner)

# nunca deixa duas ingestoes rodando ao mesmo tempo
concurrency:
  group: ingest
  cancel-in-progress: false

# necessario para o job commitar o snapshot regenerado de volta no repo
permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UPSTASH_ENDPOINT: ${{ secrets.UPSTASH_ENDPOINT }}
      UPSTASH_WRITE_API_KEY: ${{ secrets.UPSTASH_WRITE_API_KEY }}
      UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
      GEMINI_API_KEY_T1: ${{ secrets.GEMINI_API_KEY_T1 }}
      # geracao (estruturadores, data e visao das grades) no perfil de ingestao de rag/llm.py; o Gemini fica so no embedding
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instala dependencias
        run: pip install -r requirements-dev.txt

      - name: Roda o ingest incremental
        run: python pipelines/ingest_pipeline.py

      - name: Commita o snapshot se mudou (dispara o redeploy do Vercel)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ui/index.html data/info/cursos_atuais.json data/parsed/pdfs_scanned.json data/parsed/pdfs_format_errors.json data/parsed/pdfs_pii.json data/parsed/editais_reitoria.json
          if git diff --cached --quiet; then
            echo "Snapshot sem mudanca; nada a commitar."
          else
            git commit -m "ingest automatizado: atualiza snapshot + cursos"
            git pull --rebase
            git push
          fi
